services:
  mongodb:
    image: mongo:latest
    ports:
      - 27018:27017
    volumes:
      - mongodb_data:/data/db

  s3:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - 9000:9000
      - 8900:8900
    volumes:
      - minio:/data/minio
    command: 'minio server /data/minio --console-address ":8900"'

volumes:
  mongodb_data:
  minio:
