services:
  mongodb:
    image: mongo:latest
    ports:
      - 27018:27017
    volumes:
      - mongodb_data:/data/db

  storage-permissions:
    image: alpine:3.21
    user: root
    volumes:
      - rustfs_data:/data
    command: chown -R 10001:10001 /data

  storage:
    image: rustfs/rustfs:latest
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin123
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - rustfs_data:/data
    command: /data

volumes:
  mongodb_data:
  rustfs_data:
